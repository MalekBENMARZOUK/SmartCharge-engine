name: ci

on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  quality:
    name: Quality Checks
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
          cache-dependency-path: pyproject.toml

      - name: Install package and development dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"

      - name: Lint with Ruff
        run: python -m ruff check .

      - name: Format check with Ruff
        run: python -m ruff format --check .

      - name: Type check with MyPy
        run: python -m mypy src

      - name: Type check with Pyright
        run: python -m pyright

  tests:
    name: Tests (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.11', '3.12']
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: 'pip'
          cache-dependency-path: pyproject.toml

      - name: Install package and development dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"

      - name: Run test suite with coverage
        if: matrix.python-version == '3.11'
        run: python -m pytest --cov-report=term-missing --cov-report=xml --cov-fail-under=85

      - name: Run test suite
        if: matrix.python-version != '3.11'
        run: python -m pytest

      - name: Upload coverage artifact
        if: matrix.python-version == '3.11'
        uses: actions/upload-artifact@v4
        with:
          name: coverage-python-${{ matrix.python-version }}
          path: coverage.xml
          if-no-files-found: error

  docker:
    name: Docker build
    runs-on: ubuntu-latest
    needs: [quality, tests]
    timeout-minutes: 15
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Build Docker image
        run: docker build -t sce:ci .

      - name: Smoke test container
        run: |
          docker run --rm -d --name sce-smoke \
            -e SCE_STATE_REPOSITORY_BACKEND=sql \
            -e SCE_DATABASE_URL=sqlite:////app/state/smoke.db \
            -p 8000:8000 sce:ci
          sleep 5
          curl -sf http://localhost:8000/health | python3 -m json.tool
          docker stop sce-smoke
